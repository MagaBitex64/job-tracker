<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>

  <title>Трекер вакансий — Job Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

        extend: {
          colors: {
            hh: {

              redHover: '#ba0018',

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

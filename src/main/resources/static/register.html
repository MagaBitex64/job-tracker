<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Tracker - Register</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
  <script>
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-950 flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <!-- Card -->
    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-800 px-8 py-10">

      <!-- Brand -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Job Tracker</h1>
        <h2 class="text-sm text-gray-500 dark:text-gray-400 mt-1">Create your account</h2>
      </div>

      <!-- Form -->
      <form id="register-form" novalidate class="space-y-4">

        <!-- Full Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="fullName">
            Full name
          </label>
          <input
            id="fullName"
            name="fullName"
            type="text"
            autocomplete="name"
            required
            class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            placeholder="Jane Doe"
          />
          <p id="err-fullName" class="mt-1 text-xs text-red-500 hidden"></p>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="email">
            Email address
          </label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            placeholder="you@example.com"
          />
          <p id="err-email" class="mt-1 text-xs text-red-500 hidden"></p>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="password">
            Password
          </label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            placeholder="At least 8 characters"
          />
          <p id="err-password" class="mt-1 text-xs text-red-500 hidden"></p>
        </div>

        <!-- Global error -->
        <p id="register-error" class="text-sm text-red-500 text-center hidden"></p>

        <!-- Submit -->
        <button
          id="submit-btn"
          type="submit"
          class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
        >
          Create account
        </button>
      </form>

      <!-- Login link -->
      <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
        Already have an account?
        <a href="/login.html" class="text-indigo-600 hover:text-indigo-700 font-medium">Sign in</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { register } from './js/api.js';
    import { setAuth, redirectIfAuthenticated } from './js/auth.js';

    // Redirect if already logged in
    redirectIfAuthenticated();

    const form          = document.getElementById('register-form');
    const nameInput     = document.getElementById('fullName');
    const emailInput    = document.getElementById('email');
    const pwInput       = document.getElementById('password');
    const errName       = document.getElementById('err-fullName');
    const errEmail      = document.getElementById('err-email');
    const errPassword   = document.getElementById('err-password');
    const registerError = document.getElementById('register-error');
    const submitBtn     = document.getElementById('submit-btn');

    function clearErrors() {
      errName.textContent     = ''; errName.classList.add('hidden');
      errEmail.textContent    = ''; errEmail.classList.add('hidden');
      errPassword.textContent = ''; errPassword.classList.add('hidden');
      registerError.textContent = ''; registerError.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const fullName = nameInput.value.trim();
      const email    = emailInput.value.trim();
      const password = pwInput.value;

      let valid = true;
      if (!fullName) {
        errName.textContent = 'Full name is required.';
        errName.classList.remove('hidden');
        valid = false;
      }
      if (!email) {
        errEmail.textContent = 'Email is required.';
        errEmail.classList.remove('hidden');
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errEmail.textContent = 'Please enter a valid email.';
        errEmail.classList.remove('hidden');
        valid = false;
      }
      if (!password) {
        errPassword.textContent = 'Password is required.';
        errPassword.classList.remove('hidden');
        valid = false;
      } else if (password.length < 8) {
        errPassword.textContent = 'Password must be at least 8 characters.';
        errPassword.classList.remove('hidden');
        valid = false;
      }
      if (!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';

      try {
        const data = await register(email, password, fullName);
        setAuth(data.token, data.user);
        window.location.href = '/index.html';
      } catch (err) {
        // Check for 409 conflict via message heuristic (server should surface it)
        const msg = err.message || '';
        if (msg.toLowerCase().includes('409') || msg.toLowerCase().includes('already') || msg.toLowerCase().includes('exists')) {
          errEmail.textContent = 'Email already registered.';
          errEmail.classList.remove('hidden');
        } else {
          registerError.textContent = msg || 'Registration failed. Please try again.';
          registerError.classList.remove('hidden');
        }
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
